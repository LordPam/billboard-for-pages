<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock in. Let's turn this syllabus into a solved problem.</title>
    <style>
      :root {
        --pink-1: #fff5fb;
        --pink-2: #ffd9ec;
        --pink-3: #ffb2d4;
        --pink-4: #ff6cab;
        --pink-5: #d6337d;
        --pink-6: #7d1c4a;
        --paper: rgba(255, 255, 255, 0.74);
        --paper-edge: rgba(255, 255, 255, 0.88);
        --ink: #7d1c4a;
        --shadow: rgba(125, 28, 74, 0.16);
        --line: rgba(214, 51, 125, 0.18);
        --gold: #ffcf70;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.94), transparent 22%),
          radial-gradient(circle at 82% 16%, rgba(255, 255, 255, 0.42), transparent 18%),
          radial-gradient(circle at 50% -8%, rgba(255, 255, 255, 0.7), transparent 36%),
          linear-gradient(140deg, var(--pink-1), var(--pink-2) 44%, var(--pink-3) 100%);
      }

      .scene {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        padding: 2rem;
        display: grid;
        place-items: center;
      }

      .paper-grid {
        position: absolute;
        inset: 0;
        opacity: 0.34;
        background:
          linear-gradient(to bottom, transparent 95%, var(--line) 95%),
          linear-gradient(to right, transparent 95%, rgba(255, 255, 255, 0.24) 95%);
        background-size: 100% 4.25rem, 4.25rem 100%;
        pointer-events: none;
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(10px);
        opacity: 0.55;
        animation: drift 14s ease-in-out infinite;
      }

      .glow-a {
        width: min(44vw, 380px);
        height: min(44vw, 380px);
        left: -8vw;
        top: 10vh;
        background: rgba(255, 255, 255, 0.3);
      }

      .glow-b {
        width: min(34vw, 300px);
        height: min(34vw, 300px);
        right: -4vw;
        bottom: 12vh;
        background: rgba(255, 108, 171, 0.16);
        animation-delay: -6s;
      }

      .banner {
        position: relative;
        z-index: 3;
        width: min(92vw, 860px);
        padding: clamp(1.6rem, 4vw, 2.6rem);
        border: 1px solid var(--paper-edge);
        border-radius: 2rem;
        background:
          linear-gradient(180deg, var(--paper), rgba(255, 255, 255, 0.4)),
          linear-gradient(120deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
        box-shadow:
          0 1.8rem 4rem var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      .banner::before,
      .banner::after {
        content: "";
        position: absolute;
        top: 1.2rem;
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: inset 0 2px 3px rgba(125, 28, 74, 0.1);
      }

      .banner::before {
        left: 1.4rem;
      }

      .banner::after {
        right: 1.4rem;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.66);
        font-size: clamp(0.8rem, 2vw, 0.95rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        box-shadow: 0 0.8rem 1.8rem rgba(255, 108, 171, 0.12);
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 8vw, 6.6rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        text-shadow: 0 0.08em 0.28em rgba(255, 255, 255, 0.6);
      }

      .tagline {
        margin: 1rem auto 0;
        max-width: 18ch;
        font-size: clamp(1.2rem, 2.8vw, 1.85rem);
        line-height: 1.18;
        text-wrap: balance;
      }

      .highlight {
        position: absolute;
        left: 50%;
        bottom: 1.5rem;
        width: min(52vw, 420px);
        height: 1.25rem;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 207, 112, 0.24), var(--gold), rgba(255, 207, 112, 0.24));
        filter: blur(0.8px);
        transform: translateX(-50%) rotate(-2deg);
        animation: swipe 5s ease-in-out infinite;
        z-index: -1;
      }

      .book {
        position: absolute;
        left: clamp(1rem, 6vw, 4.5rem);
        bottom: clamp(1.5rem, 7vh, 4rem);
        width: clamp(150px, 22vw, 240px);
        aspect-ratio: 1.15 / 0.78;
        z-index: 2;
        animation: bob 5.8s ease-in-out infinite;
      }

      .book-cover {
        position: absolute;
        inset: 0;
        border-radius: 1.4rem;
        background: linear-gradient(145deg, #ff86bb, #ffc2dd);
        box-shadow: 0 1.6rem 2.8rem rgba(214, 51, 125, 0.2);
      }

      .book-pages {
        position: absolute;
        inset: 8% 8% 10% 8%;
        border-radius: 1rem;
        background:
          linear-gradient(to bottom, transparent 78%, rgba(214, 51, 125, 0.14) 78% 82%, transparent 82%),
          linear-gradient(to right, rgba(255, 204, 229, 0.9) 0 6%, rgba(255, 255, 255, 0.92) 6%);
        overflow: hidden;
      }

      .book-pages::before,
      .book-pages::after {
        content: "";
        position: absolute;
        top: 0;
        width: 47%;
        height: 100%;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(214, 51, 125, 0.04) 0 0.95rem,
            rgba(255, 255, 255, 0) 0.95rem 1.9rem
          ),
          rgba(255, 255, 255, 0.88);
        transform-origin: center left;
      }

      .book-pages::before {
        left: 2%;
        border-radius: 0.8rem 0.3rem 0.3rem 0.8rem;
        animation: pageLeft 4.2s ease-in-out infinite;
      }

      .book-pages::after {
        right: 2%;
        border-radius: 0.3rem 0.8rem 0.8rem 0.3rem;
        transform-origin: center right;
        animation: pageRight 4.2s ease-in-out infinite;
      }

      .flashcards {
        position: absolute;
        right: clamp(1rem, 6vw, 4rem);
        top: clamp(1.5rem, 8vh, 4rem);
        width: clamp(130px, 18vw, 200px);
        aspect-ratio: 1 / 1.05;
        z-index: 2;
        animation: bob 6.2s ease-in-out infinite -1.2s;
      }

      .flashcard {
        position: absolute;
        inset: 0;
        border-radius: 1.2rem;
        border: 1px solid rgba(255, 255, 255, 0.86);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.64));
        box-shadow: 0 1rem 2rem rgba(125, 28, 74, 0.12);
      }

      .flashcard:nth-child(1) {
        transform: rotate(-8deg) translate(-0.6rem, 0.5rem);
      }

      .flashcard:nth-child(2) {
        transform: rotate(6deg) translate(0.6rem, 0.2rem);
      }

      .flashcard:nth-child(3) {
        transform: rotate(-2deg);
      }

      .flashcard::before,
      .flashcard::after {
        content: "";
        position: absolute;
        left: 14%;
        right: 14%;
        border-radius: 999px;
      }

      .flashcard::before {
        top: 24%;
        height: 0.85rem;
        background: rgba(255, 108, 171, 0.2);
      }

      .flashcard::after {
        top: 44%;
        height: 0.6rem;
        background: rgba(214, 51, 125, 0.1);
        box-shadow:
          0 1.3rem 0 rgba(214, 51, 125, 0.1),
          0 2.6rem 0 rgba(214, 51, 125, 0.1);
      }

      .pencil {
        position: absolute;
        right: clamp(4rem, 17vw, 16rem);
        bottom: clamp(3rem, 12vh, 7rem);
        width: clamp(180px, 24vw, 280px);
        height: 1.1rem;
        border-radius: 999px;
        background:
          linear-gradient(
            to right,
            #ffef9c 0 8%,
            #f8b6d3 8% 78%,
            #f06da9 78% 88%,
            #fce4c1 88% 96%,
            #7d1c4a 96% 100%
          );
        transform: rotate(-28deg);
        box-shadow: 0 1rem 2rem rgba(125, 28, 74, 0.14);
        animation: write 4.8s ease-in-out infinite;
        z-index: 2;
      }

      .pencil::before {
        content: "";
        position: absolute;
        left: -0.7rem;
        top: 0;
        border-top: 0.55rem solid transparent;
        border-bottom: 0.55rem solid transparent;
        border-right: 0.8rem solid #fce4c1;
      }

      .pencil::after {
        content: "";
        position: absolute;
        left: -0.95rem;
        top: 0.18rem;
        border-top: 0.36rem solid transparent;
        border-bottom: 0.36rem solid transparent;
        border-right: 0.45rem solid #7d1c4a;
      }

      .sparkles {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .sparkle {
        position: absolute;
        width: 1rem;
        aspect-ratio: 1;
        background: rgba(255, 255, 255, 0.68);
        clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
        animation: twinkle 3.2s ease-in-out infinite;
      }

      .sparkle:nth-child(1) {
        left: 18%;
        top: 18%;
      }

      .sparkle:nth-child(2) {
        left: 74%;
        top: 26%;
        animation-delay: -1.1s;
      }

      .sparkle:nth-child(3) {
        left: 26%;
        bottom: 24%;
        animation-delay: -2s;
      }

      .sparkle:nth-child(4) {
        right: 20%;
        bottom: 18%;
        animation-delay: -0.5s;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }

        50% {
          transform: translate3d(1.4rem, -1.2rem, 0) scale(1.08);
        }
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-0.8rem);
        }
      }

      @keyframes pageLeft {
        0%,
        100% {
          transform: perspective(240px) rotateY(0deg);
        }

        50% {
          transform: perspective(240px) rotateY(-11deg);
        }
      }

      @keyframes pageRight {
        0%,
        100% {
          transform: perspective(240px) rotateY(0deg);
        }

        50% {
          transform: perspective(240px) rotateY(11deg);
        }
      }

      @keyframes write {
        0%,
        100% {
          transform: translate(0, 0) rotate(-28deg);
        }

        50% {
          transform: translate(-1.2rem, 0.5rem) rotate(-24deg);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          transform: scale(0.8);
          opacity: 0.45;
        }

        50% {
          transform: scale(1.15);
          opacity: 0.9;
        }
      }

      @keyframes swipe {
        0%,
        100% {
          transform: translateX(-50%) rotate(-2deg) scaleX(0.92);
        }

        50% {
          transform: translateX(-50%) rotate(1deg) scaleX(1.06);
        }
      }

      @media (max-width: 800px) {
        .scene {
          padding: 1.2rem;
        }

        .banner {
          padding: 1.4rem 1rem 1.8rem;
          border-radius: 1.5rem;
        }

        .tagline {
          max-width: 14ch;
        }

        .book {
          width: 150px;
          left: 0.8rem;
          bottom: 1.2rem;
        }

        .flashcards {
          width: 124px;
          right: 0.8rem;
          top: 1rem;
        }

        .pencil {
          right: 1rem;
          bottom: 7rem;
          width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Billboard page: replace this file to swap the entire GitHub Pages site. -->
    <main class="scene">
      <div class="paper-grid" aria-hidden="true"></div>
      <div class="glow glow-a" aria-hidden="true"></div>
      <div class="glow glow-b" aria-hidden="true"></div>

      <div class="sparkles" aria-hidden="true">
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>
      </div>

      <div class="flashcards" aria-hidden="true">
        <div class="flashcard"></div>
        <div class="flashcard"></div>
        <div class="flashcard"></div>
      </div>

      <div class="book" aria-hidden="true">
        <div class="book-cover"></div>
        <div class="book-pages"></div>
      </div>

      <div class="pencil" aria-hidden="true"></div>

      <section class="banner" aria-label="Billboard message">
        <span class="eyebrow">Revision Mode</span>
        <h1>Lock in.</h1>
        <p class="tagline">Let's turn this syllabus into a solved problem.</p>
        <div class="highlight" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
