<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I'll catch you if you fall.</title>
    <style>
      :root {
        --pink-1: #fff4f8;
        --pink-2: #ffd6e7;
        --pink-3: #ff9bc4;
        --pink-4: #ff5fa2;
        --pink-5: #9f1d5f;
        --shine: rgba(255, 255, 255, 0.72);
        --shadow: rgba(159, 29, 95, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.92), transparent 30%),
          radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.44), transparent 20%),
          radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.34), transparent 24%),
          linear-gradient(155deg, var(--pink-1), var(--pink-2) 42%, var(--pink-3) 100%);
        color: var(--pink-5);
        font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
      }

      main {
        position: relative;
        width: min(92vw, 900px);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 3rem 1.5rem 7rem;
      }

      .message {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        max-width: 11ch;
        font-size: clamp(3.4rem, 9vw, 7.8rem);
        line-height: 0.94;
        letter-spacing: -0.05em;
        font-style: italic;
        font-weight: 600;
        text-wrap: balance;
        text-shadow: 0 0.08em 0.24em rgba(255, 255, 255, 0.56);
      }

      .heart {
        position: relative;
        width: clamp(58px, 9vw, 82px);
        aspect-ratio: 1;
        transform: rotate(-45deg);
        background: linear-gradient(145deg, var(--pink-4), #ff7ab5);
        box-shadow: 0 1.3rem 2rem var(--shadow);
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: inherit;
      }

      .heart::before {
        top: -50%;
        left: 0;
      }

      .heart::after {
        top: 0;
        left: 50%;
      }

      .heart-shine {
        position: absolute;
        inset: 14% auto auto 18%;
        width: 18%;
        height: 12%;
        border-radius: 999px;
        background: var(--shine);
        transform: rotate(22deg);
      }

      .heart-wrap {
        position: relative;
        width: clamp(58px, 9vw, 82px);
        aspect-ratio: 1;
      }

      @media (max-width: 700px) {
        main {
          padding-bottom: 5rem;
        }

        h1 {
          max-width: 9ch;
        }
      }
    </style>
  </head>
  <body>
    <!-- Billboard page: replace this file to swap the entire GitHub Pages site. -->
    <main>
      <section class="message" aria-label="Billboard message">
        <h1>I'll catch you if you fall.</h1>
        <div class="heart-wrap" aria-hidden="true">
          <div class="heart"></div>
          <div class="heart-shine"></div>
        </div>
      </section>
    </main>
  </body>
</html>
