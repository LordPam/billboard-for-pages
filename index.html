<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>me and you = μ</title>
    <style>
      :root {
        --pink-1: #fff5fb;
        --pink-2: #ffd5e9;
        --pink-3: #ff99c5;
        --pink-4: #ff5fa4;
        --pink-5: #d92e7c;
        --pink-6: #7d1746;
        --white-glass: rgba(255, 255, 255, 0.56);
        --white-line: rgba(255, 255, 255, 0.78);
        --shadow: rgba(125, 23, 70, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        overflow: hidden;
        color: var(--pink-6);
        font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.92), transparent 24%),
          radial-gradient(circle at 82% 20%, rgba(255, 255, 255, 0.34), transparent 18%),
          radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.75), transparent 34%),
          linear-gradient(140deg, var(--pink-1), var(--pink-2) 42%, var(--pink-3) 100%);
        background-size: 180% 180%;
        animation: skyShift 16s ease-in-out infinite alternate;
      }

      .scene {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .glow {
        position: absolute;
        inset: auto;
        border-radius: 50%;
        filter: blur(10px);
        opacity: 0.6;
        animation: drift 13s ease-in-out infinite;
      }

      .glow-a {
        width: min(48vw, 420px);
        height: min(48vw, 420px);
        left: -8vw;
        top: 6vh;
        background: rgba(255, 255, 255, 0.38);
      }

      .glow-b {
        width: min(34vw, 320px);
        height: min(34vw, 320px);
        right: 2vw;
        top: 12vh;
        background: rgba(255, 95, 164, 0.18);
        animation-delay: -5s;
      }

      .glow-c {
        width: min(54vw, 460px);
        height: min(54vw, 460px);
        right: -10vw;
        bottom: -4vh;
        background: rgba(255, 255, 255, 0.18);
        animation-delay: -8s;
      }

      .banner {
        position: relative;
        z-index: 3;
        width: min(92vw, 900px);
        padding: clamp(1.5rem, 3vw, 2.4rem);
        border: 1px solid var(--white-line);
        border-radius: 2rem;
        text-align: center;
        background:
          linear-gradient(180deg, var(--white-glass), rgba(255, 255, 255, 0.28)),
          linear-gradient(120deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
        box-shadow:
          0 1.6rem 4rem var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
      }

      .banner::before,
      .banner::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
        filter: blur(1px);
      }

      .banner::before {
        width: 7rem;
        height: 7rem;
        left: -1.5rem;
        top: -1.75rem;
      }

      .banner::after {
        width: 10rem;
        height: 10rem;
        right: -2rem;
        bottom: -2rem;
      }

      .ribbon {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1.1rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 0.8rem 1.8rem rgba(255, 95, 164, 0.12);
        font-size: clamp(0.8rem, 2vw, 0.95rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .mini-heart {
        position: relative;
        width: 0.9rem;
        height: 0.9rem;
        transform: rotate(-45deg);
        background: linear-gradient(145deg, var(--pink-4), var(--pink-5));
      }

      .mini-heart::before,
      .mini-heart::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: inherit;
      }

      .mini-heart::before {
        top: -50%;
        left: 0;
      }

      .mini-heart::after {
        top: 0;
        left: 50%;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6.2vw, 5.8rem);
        max-width: 16ch;
        line-height: 0.93;
        letter-spacing: -0.05em;
        text-wrap: balance;
        overflow-wrap: anywhere;
        text-shadow: 0 0.08em 0.28em rgba(255, 255, 255, 0.55);
      }

      .logs {
        margin: 1.35rem 0 0;
        font-family: "Courier New", "SFMono-Regular", monospace;
        font-size: clamp(1rem, 2.5vw, 1.6rem);
        letter-spacing: 0.16em;
        text-transform: lowercase;
        color: var(--pink-5);
        text-shadow: 0 0 18px rgba(255, 95, 164, 0.32);
        animation: bob 3s ease-in-out infinite;
      }

      .heart-orbit {
        position: absolute;
        z-index: 2;
        width: clamp(92px, 12vw, 138px);
        aspect-ratio: 1;
        top: 12vh;
        right: clamp(1rem, 6vw, 5rem);
        animation: floatHeart 5.8s ease-in-out infinite;
      }

      .heart-orbit .heart {
        position: absolute;
        inset: 26%;
        transform: rotate(-45deg);
        background: linear-gradient(145deg, rgba(255, 95, 164, 0.95), rgba(217, 46, 124, 0.98));
        box-shadow: 0 1.3rem 2.2rem rgba(217, 46, 124, 0.22);
      }

      .heart-orbit .heart::before,
      .heart-orbit .heart::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: inherit;
      }

      .heart-orbit .heart::before {
        top: -50%;
        left: 0;
      }

      .heart-orbit .heart::after {
        top: 0;
        left: 50%;
      }

      .heart-orbit .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.65);
        animation: pulseRing 4s ease-in-out infinite;
      }

      .heart-orbit .ring:nth-child(2) {
        inset: 10%;
        animation-delay: -1.4s;
      }

      .heart-orbit .ring:nth-child(3) {
        inset: 20%;
        animation-delay: -2.8s;
      }

      .floaters {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .floater {
        position: absolute;
        bottom: -10vh;
        width: clamp(12px, 1.8vw, 18px);
        aspect-ratio: 1;
        border-radius: 50% 50% 48% 48%;
        background:
          radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.92), transparent 24%),
          linear-gradient(160deg, rgba(255, 255, 255, 0.85), rgba(255, 95, 164, 0.65));
        opacity: 0.78;
        filter: blur(0.3px);
        animation: rise linear infinite;
      }

      .floater:nth-child(1) {
        left: 9%;
        animation-duration: 12s;
        animation-delay: -7s;
      }

      .floater:nth-child(2) {
        left: 20%;
        width: clamp(16px, 2.2vw, 24px);
        animation-duration: 15s;
        animation-delay: -3s;
      }

      .floater:nth-child(3) {
        left: 36%;
        animation-duration: 11s;
        animation-delay: -9s;
      }

      .floater:nth-child(4) {
        left: 58%;
        width: clamp(14px, 2vw, 20px);
        animation-duration: 16s;
        animation-delay: -12s;
      }

      .floater:nth-child(5) {
        left: 76%;
        animation-duration: 13s;
        animation-delay: -5s;
      }

      .floater:nth-child(6) {
        left: 88%;
        width: clamp(18px, 2.6vw, 26px);
        animation-duration: 18s;
        animation-delay: -14s;
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        height: min(34vh, 280px);
        z-index: 0;
        pointer-events: none;
      }

      .wave {
        position: absolute;
        left: -10%;
        width: 120%;
        border-radius: 45% 55% 0 0;
        transform-origin: center bottom;
      }

      .wave-1 {
        bottom: -2rem;
        height: 46%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.52));
        animation: sway 8s ease-in-out infinite;
      }

      .wave-2 {
        bottom: -1rem;
        height: 36%;
        background: linear-gradient(180deg, rgba(255, 153, 197, 0.3), rgba(255, 95, 164, 0.48));
        animation: sway 6s ease-in-out infinite reverse;
      }

      .wave-3 {
        bottom: 0;
        height: 25%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.65));
        animation: sway 4.6s ease-in-out infinite;
      }

      @keyframes skyShift {
        from {
          background-position: 0% 50%;
        }

        to {
          background-position: 100% 50%;
        }
      }

      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }

        50% {
          transform: translate3d(1.5rem, -1.4rem, 0) scale(1.08);
        }
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-0.3rem);
        }
      }

      @keyframes floatHeart {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }

        50% {
          transform: translateY(-0.9rem) rotate(3deg);
        }
      }

      @keyframes pulseRing {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.72;
        }

        50% {
          transform: scale(1.06);
          opacity: 0.35;
        }
      }

      @keyframes rise {
        0% {
          transform: translate3d(0, 0, 0) scale(0.8) rotate(0deg);
          opacity: 0;
        }

        10% {
          opacity: 0.8;
        }

        100% {
          transform: translate3d(2vw, -120vh, 0) scale(1.15) rotate(24deg);
          opacity: 0;
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: translateX(0) rotate(0deg);
        }

        50% {
          transform: translateX(2.4%) rotate(-1.2deg);
        }
      }

      @media (max-width: 720px) {
        .scene {
          padding: 1.25rem;
        }

        .banner {
          padding: 1.35rem 1rem 1.6rem;
          border-radius: 1.5rem;
        }

        .heart-orbit {
          top: auto;
          right: auto;
          left: 50%;
          bottom: 19vh;
          transform: translateX(-50%);
          width: 96px;
        }

        .waves {
          height: 28vh;
        }

        .logs {
          letter-spacing: 0.08em;
          word-break: break-word;
        }
      }
    </style>
  </head>
  <body>
    <!-- Billboard page: replace this file to swap the entire GitHub Pages site. -->
    <main class="scene">
      <div class="glow glow-a" aria-hidden="true"></div>
      <div class="glow glow-b" aria-hidden="true"></div>
      <div class="glow glow-c" aria-hidden="true"></div>

      <div class="heart-orbit" aria-hidden="true">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="heart"></div>
      </div>

      <div class="floaters" aria-hidden="true">
        <span class="floater"></span>
        <span class="floater"></span>
        <span class="floater"></span>
        <span class="floater"></span>
        <span class="floater"></span>
        <span class="floater"></span>
      </div>

      <section class="banner" aria-label="Billboard message">
        <h1>me and you = μ</h1>
      </section>

      <div class="waves" aria-hidden="true">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
      </div>
    </main>
  </body>
</html>
